<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>야적장 소품 만들기</title></head>
<body style="background:#222;color:#ddd;font:13px monospace">
<pre id="log"></pre>
<script type="module">
// 받은 소품(tools/tmp/props_src — 원본은 다운로드 폴더)에서 쓸 조각만 골라 public/models/yard_props.glb 로 굽는다.
// 조각마다 크기를 게임 단위(m)로 맞추고, 바닥 가운데가 원점(밑면 y=0)이 되게 옮긴 이름 붙은 노드 하나로 만든다.
// 텍스처는 512 이하 JPEG. shot_server.cjs (?out=models) 가 받아 저장한다.
//   ?dry  저장하지 않고 크기만 본다
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const SRC = '/tools/tmp/props_src';
// [게임 이름, 원본 폴더, 원본 노드 이름(없으면 전체), 배율, Y 회전]
const PIECES = [
  ['Tank', 'chemical_tank', null, 1, 0],                    // 탱크 둘 · 받침 (2.7 × 5.7 × 6.2m)
  ['Forklift', 'forklift_low_poly', null, 0.01, 0],         // cm → m (1.2 × 2.1 × 3.7m)
  ['FloodHead', 'flood_light_02', null, 1, 0],              // 투광등 머리 — 게임에서 기둥 위에 단다
  ['Pipe', 'construction_site_asset_pack', 'Concrete_Pipe1', 0.5, 0],
  ['Pipes', 'construction_site_asset_pack', 'Concrete_Pipe2', 0.5, 0],
  ['Reel', 'construction_site_asset_pack', 'Cylinder.001', 0.5, 0],
  ['PipeStack', 'construction_site_asset_pack', 'pipe_stack_planks', 0.5, 0],
  ['Planks', 'construction_site_asset_pack', 'Planks', 0.5, 0],
  ['CementPallet', 'construction_site_asset_pack', 'Pallet1.002', 0.5, 0],
];

const loader = new GLTFLoader();
const cache = {};
const out = new THREE.Scene();
const sizes = {};
for (const [name, dir, node, scale, yaw] of PIECES) {
  const g = (cache[dir] ??= await loader.loadAsync(`${SRC}/${dir}/scene.gltf`));
  g.scene.updateMatrixWorld(true);
  const src = node ? g.scene.getObjectByName(node.replace('.', '')) ?? g.scene.getObjectByName(node) : g.scene;
  if (!src) { log(`없음: ${node}`); continue; }
  // 원본의 세계 변환까지 구워서 떼어 온다
  const piece = new THREE.Group();
  src.traverse((o) => {
    if (!o.isMesh) return;
    const m = new THREE.Mesh(o.geometry.clone().applyMatrix4(o.matrixWorld), o.material);
    piece.add(m);
  });
  const wrap = new THREE.Group();
  wrap.add(piece);
  piece.scale.setScalar(scale);
  piece.rotation.y = yaw;
  wrap.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(wrap), c = box.getCenter(new THREE.Vector3());
  piece.position.set(-c.x, -box.min.y, -c.z);
  wrap.updateMatrixWorld(true);
  const size = new THREE.Box3().setFromObject(wrap).getSize(new THREE.Vector3());
  // 메시에 변환을 다시 구워 넣어 노드 하나 = 크기 맞춘 모델
  const node2 = new THREE.Group();
  node2.name = name;
  piece.traverse((o) => { if (o.isMesh) { o.updateMatrixWorld(true); const m = new THREE.Mesh(o.geometry.clone().applyMatrix4(o.matrixWorld), o.material); m.name = name; node2.add(m); } });
  out.add(node2);
  sizes[name] = size.toArray().map((v) => +v.toFixed(2));
  log(`${name}: ${sizes[name].join(' × ')} m`);
}
// 텍스처는 JPEG 로 (노멀도 — 알파를 안 쓴다)
out.traverse((o) => {
  if (!o.isMesh) return;
  for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap']) {
    if (o.material[k]) o.material[k].userData.mimeType = 'image/jpeg';
  }
});
window.sizes = sizes;
if (new URLSearchParams(location.search).has('dry')) { log('dry — 저장 안 함'); document.title = 'done'; }
else {
  const glb = await new GLTFExporter().parseAsync(out, { binary: true, maxTextureSize: 512 });
  await fetch('http://127.0.0.1:5199/save?out=models&name=yard_props.glb', { method: 'POST', body: new Blob([glb], { type: 'text/plain' }) });
  log(`저장 yard_props.glb ${(glb.byteLength / 1048576).toFixed(1)} MB`);
  document.title = 'done';
}
</script>
</body>
</html>
