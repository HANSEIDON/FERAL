<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><title>cover</title>
<base href="/">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#111;color:#ccc;font:12px monospace} canvas{display:block;max-width:100%}</style>
</head>
<body>
<canvas id="out"></canvas>
<pre id="log"></pre>
<script type="module">
// itch.io 커버 (630×500, 2배로 그려서 줄인다) — 큰 제목 FERAL, 위에 M4, 아래에 활과 화살, 좀비 발톱 자국이 제목을 찢는다.
// 무기는 게임 모델을 그대로 렌더링한다.  ?save → shot_server(5199) 로 저장
import * as THREE from 'three';
import { initLoaders, loadModel } from '/src/core/assets.js';

const q = new URLSearchParams(location.search);
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const W = 1260, H = 1000;

// ── 무기 한 개를 투명 배경에 렌더링 ──
const gl = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
gl.outputColorSpace = THREE.SRGBColorSpace;
gl.toneMapping = THREE.ACESFilmicToneMapping;
gl.toneMappingExposure = 1.25;
initLoaders(gl);

async function renderPiece(file, node, { w, h, roll = 0, flip = false, spin = 0 }) {
  const g = await loadModel(file);
  const src = g.scene.getObjectByName(node);
  const obj = src.clone(true);
  const scene = new THREE.Scene();
  const holder = new THREE.Group();
  holder.add(obj);
  scene.add(holder);
  // 가장 긴 축을 X 로, 가장 얇은 축을 Z(카메라 쪽)로
  obj.position.set(0, 0, 0); obj.rotation.set(0, 0, 0); obj.scale.setScalar(1);
  obj.updateMatrixWorld(true);
  let b = new THREE.Box3().setFromObject(obj), s = b.getSize(new THREE.Vector3());
  const ax = ['x', 'y', 'z'].sort((a, c) => s[c] - s[a]);   // 긴 순서
  const long = ax[0], thin = ax[2];
  if (long === 'y') obj.rotation.z = Math.PI / 2;
  if (long === 'z') obj.rotation.y = Math.PI / 2;
  obj.updateMatrixWorld(true);
  b = new THREE.Box3().setFromObject(obj); s = b.getSize(new THREE.Vector3());
  if (s.z > s.y) { obj.rotation.x += Math.PI / 2; }
  if (flip) obj.rotation.y += Math.PI;
  holder.rotation.z = roll;
  holder.rotation.y = spin;
  holder.updateMatrixWorld(true);
  b = new THREE.Box3().setFromObject(holder);
  const c = b.getCenter(new THREE.Vector3()); s = b.getSize(new THREE.Vector3());
  holder.position.sub(c);
  // 조명: 위 앞 흰 키 라이트 + 뒤쪽 주황 · 빨강 테두리 빛 (게임 HUD 색)
  scene.add(new THREE.HemisphereLight(0x8090a8, 0x201510, 0.6));
  const key = new THREE.DirectionalLight(0xfff2e0, 3.2); key.position.set(1, 3, 4); scene.add(key);
  const rimA = new THREE.DirectionalLight(0xffa04a, 2.6); rimA.position.set(3, 1.5, -3); scene.add(rimA);
  const rimB = new THREE.DirectionalLight(0xff3020, 0.9); rimB.position.set(-3, -1, -3); scene.add(rimB);
  const aspect = w / h, pad = 1.06;
  const halfW = Math.max(s.x / 2, (s.y / 2) * aspect) * pad;
  const cam = new THREE.OrthographicCamera(-halfW, halfW, halfW / aspect, -halfW / aspect, -50, 50);
  cam.position.set(0, 0, 10); cam.lookAt(0, 0, 0);
  gl.setSize(w, h, false);
  gl.setClearColor(0x000000, 0);
  gl.render(scene, cam);
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  out.getContext('2d').drawImage(gl.domElement, 0, 0);
  log(`${node}: ${s.toArray().map((v) => v.toFixed(2)).join(' × ')}`);
  return out;
}

await document.fonts.load('200px Anton');
await document.fonts.load('600 40px Oswald');

const rifle = await renderPiece('./models/gunner_props.glb', 'Rifle', { w: 1100, h: 380, roll: 0.06, flip: q.has('flipRifle') });
const bow = await renderPiece('./models/hunter_props.glb', 'Bow', { w: 1000, h: 300, roll: 0, flip: q.has('flipBow') });
const arrow = await renderPiece('./models/hunter_props.glb', 'Arrow', { w: 1000, h: 90, roll: 0, flip: q.has('flipArrow') });

// ── 합성 ──
const cv = document.getElementById('out');
cv.width = W; cv.height = H;
const x = cv.getContext('2d');

// 배경: 거의 검정 + 가운데 핏빛 안개 + 위쪽 나트륨 빛 + 거친 결
x.fillStyle = '#07080b'; x.fillRect(0, 0, W, H);
let g = x.createRadialGradient(W / 2, H * 0.52, 40, W / 2, H * 0.52, W * 0.62);
g.addColorStop(0, 'rgba(120,22,16,0.55)'); g.addColorStop(0.55, 'rgba(60,12,10,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
x.fillStyle = g; x.fillRect(0, 0, W, H);
g = x.createRadialGradient(W / 2, -80, 10, W / 2, -80, 700);
g.addColorStop(0, 'rgba(255,170,90,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
x.fillStyle = g; x.fillRect(0, 0, W, H);
const img = x.getImageData(0, 0, W, H), d = img.data;
for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
x.putImageData(img, 0, 0);

// 위: M4
x.save();
x.shadowColor = 'rgba(0,0,0,0.85)'; x.shadowBlur = 30; x.shadowOffsetY = 14;
x.drawImage(rifle, (W - rifle.width) / 2, 36);
x.restore();

// 가운데: 제목 (따로 그려서 발톱 자국으로 찢는다)
const t = document.createElement('canvas'); t.width = W; t.height = H;
const tx = t.getContext('2d');
tx.font = '330px Anton';
tx.textAlign = 'center'; tx.textBaseline = 'alphabetic';
if ('letterSpacing' in tx) tx.letterSpacing = '22px';
const baseY = 640;
let tg = tx.createLinearGradient(0, baseY - 260, 0, baseY);
tg.addColorStop(0, '#fbf6ec'); tg.addColorStop(1, '#d9cfbf');
tx.fillStyle = tg;
tx.fillText('FERAL', W / 2 + 11, baseY);
// 낡은 결 — 군데군데 긁어 낸다
tx.globalCompositeOperation = 'destination-out';
for (let i = 0; i < 900; i++) {
  tx.fillStyle = `rgba(0,0,0,${0.15 + Math.random() * 0.45})`;
  tx.fillRect(Math.random() * W, 330 + Math.random() * 330, 1 + Math.random() * 5, 1 + Math.random() * 1.5);
}
for (let i = 0; i < 14; i++) {   // 굵은 긁힘 몇 줄
  tx.strokeStyle = `rgba(0,0,0,${0.3 + Math.random() * 0.4})`; tx.lineWidth = 1.5 + Math.random() * 2;
  const y0 = 360 + Math.random() * 260, x0 = 150 + Math.random() * 900;
  tx.beginPath(); tx.moveTo(x0, y0); tx.lineTo(x0 + 40 + Math.random() * 120, y0 + (Math.random() - 0.5) * 30); tx.stroke();
}
// 좀비 발톱 세 줄 — 오른쪽 위에서 왼쪽 아래로, 제목을 찢는다
const claws = [0, 1, 2].map((k) => ({ x0: 905 + k * 70, y0: 290 + k * 20, x1: 470 + k * 78, y1: 770 + k * 12, w: 46 - k * 5 }));
const claw = (ctx, c, grow = 0) => {
  const nx = c.y1 - c.y0, ny = -(c.x1 - c.x0), L = Math.hypot(nx, ny);
  const ux = nx / L, uy = ny / L, mx = (c.x0 + c.x1) / 2, my = (c.y0 + c.y1) / 2, wd = c.w + grow;
  ctx.beginPath();
  ctx.moveTo(c.x0, c.y0);
  ctx.quadraticCurveTo(mx + ux * wd, my + uy * wd, c.x1, c.y1);
  ctx.quadraticCurveTo(mx - ux * wd * 0.15, my - uy * wd * 0.15, c.x0, c.y0);
  ctx.fill();
};
tx.fillStyle = '#000';
for (const c of claws) claw(tx, c);
tx.globalCompositeOperation = 'source-over';
x.save();
x.shadowColor = 'rgba(0,0,0,0.9)'; x.shadowBlur = 40; x.shadowOffsetY = 10;
x.drawImage(t, 0, 0);
x.restore();
// 찢긴 자리 안쪽 — 핏빛
for (const c of claws) {
  x.save();
  x.fillStyle = 'rgba(176,22,16,0.95)'; x.shadowColor = 'rgba(255,50,25,0.7)'; x.shadowBlur = 30;
  claw(x, { ...c, w: c.w * 0.62 });
  x.restore();
}

// 아래: 활과 화살 (활은 눕혀서, 화살은 그 위에 가로로)
x.save();
x.shadowColor = 'rgba(0,0,0,0.85)'; x.shadowBlur = 26; x.shadowOffsetY = 12;
x.drawImage(bow, (W - bow.width) / 2, 690);
x.drawImage(arrow, (W - arrow.width) / 2 + 10, 790);
x.restore();

// 맨 아래 한 줄
x.font = '600 34px Oswald';
x.textAlign = 'center';
if ('letterSpacing' in x) x.letterSpacing = '10px';
x.fillStyle = '#ffb46e';
x.fillText('MULTIPLAYER ZOMBIE TAG', W / 2, 958);

// 가장자리 어둡게
g = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.75);
g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.7)');
x.fillStyle = g; x.fillRect(0, 0, W, H);

if (q.has('save')) {
  const save = async (name, canvas) => {
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
    await fetch(`http://127.0.0.1:5199/save?out=shots&name=${name}`, { method: 'POST', body: new Blob([await blob.arrayBuffer()], { type: 'text/plain' }) });
  };
  const small = document.createElement('canvas'); small.width = 630; small.height = 500;
  const sx = small.getContext('2d'); sx.imageSmoothingQuality = 'high'; sx.drawImage(cv, 0, 0, 630, 500);
  await save('cover_2x.png', cv);
  await save('cover.png', small);
  log('saved');
}
document.title = 'done';
</script>
</body>
</html>
