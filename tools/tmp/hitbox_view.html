<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>히트박스 확인</title>
<style>html, body { margin: 0; background: #222; overflow: hidden; } canvas { display: block; }</style></head>
<body>
<script type="module">
// 임시 — 좀비 · 생존자 여러 동작에 판정 구(빨강 = 머리, 초록 = 몸)를 겹쳐 본다
//   ?c=zombie|hunter|gunner  ?clips=idle,attack,rage,run  ?yaw=도
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { initLoaders } from '/src/core/assets.js';
import { preloadAvatars, getModel } from '/src/game/remotePlayers.js';
import { debugHitboxes } from '/src/game/combat.js';

const q = new URLSearchParams(location.search);
const c = q.get('c') ?? 'zombie';
const clips = (q.get('clips') ?? 'idle,attack,rage,run').split(',');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x30343a);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
initLoaders(renderer);
await preloadAvatars('/');
const g = getModel(c);
const role = c === 'zombie' ? 'zombie' : 'survivor';
clips.forEach((name, i) => {
  const obj = SkeletonUtils.clone(g.scene);
  obj.position.x = (i - (clips.length - 1) / 2) * 2.2;
  obj.rotation.y = (+(q.get('yaw') ?? 90) * Math.PI) / 180;
  scene.add(obj);
  const clip = g.animations.find((a) => a.name === name) ?? g.animations[0];
  const m = new THREE.AnimationMixer(obj);
  m.clipAction(clip).play();
  const ts = (q.get('ts') ?? '').split(',').map(Number);
  m.update(ts.length > 1 ? ts[i] : +(q.get('t') ?? 0.6));
  obj.updateMatrixWorld(true);
  if (!q.get('nohit')) for (const p of debugHitboxes({ role, pos: obj.position, avatar: obj })) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(p.r, 16, 12),
      new THREE.MeshBasicMaterial({ color: p.head ? 0xff3030 : 0x30ff60, wireframe: true, transparent: true, opacity: 0.7 }));
    s.position.copy(p.c);
    scene.add(s);
  }
});
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0, 1.3, 9);
cam.lookAt(0, 1.1, 0);
renderer.setAnimationLoop(() => renderer.render(scene, cam));
</script>
</body>
</html>
