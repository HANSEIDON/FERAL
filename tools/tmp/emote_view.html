<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><base href="/"><title>춤 확인</title>
<style>html, body { margin: 0; background: #222; overflow: hidden; } canvas { display: block; }</style></head>
<body>
<script type="module">
// 임시 — 세 캐릭터(좀비 · 사냥꾼 · 총수)에 같은 춤을 틀어 본다. 게임과 같은 makeAvatar · emote 경로
//   ?n=1|2|3  ?t=초 (그 시각에서 멈춤)
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { initLoaders } from '/src/core/assets.js';
import { preloadAvatars, makeAvatar } from '/src/game/remotePlayers.js';
import { loadEmotes } from '/src/game/emotes.js';

const q = new URLSearchParams(location.search);
const n = +(q.get('n') ?? 1), T = +(q.get('t') ?? 0.4);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x30343a);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.GridHelper(12, 12, 0x555555, 0x444444));
initLoaders(renderer);
await preloadAvatars('/');
await loadEmotes();
[['zombie', 'zombie'], ['survivor', 'hunter'], ['survivor', 'gunner']].forEach(([role, model], i) => {
  const av = makeAvatar(role, model);
  av.position.x = (i - 1) * 2.6;
  av.rotation.y = 0.5;
  scene.add(av);
  const anim = av.userData.anim;
  anim.update(1 / 60, 0, 'alive', 0);
  const crawl = q.get('crawl');   // ?crawl=1 — 쓰러져서 기어가기 (속도 0.55)
  const ok = crawl ? true : anim.emote(n);
  for (let t = 0; t < T; t += 1 / 60) anim.update(1 / 60, crawl ? 1 : 0, crawl ? 'downed' : 'alive', crawl ? 0.55 : 0);
  document.title += ` ${model}:${ok}`;
});
// ?cpr=1 — 사냥꾼(쓰러짐)을 SWAT 이 살린다 : 둘 다 같은 원점 · 방향 (main.js updateCpr 와 같다)
//   ?dying=1 — 셋 다 죽음 동작
if (q.get('cpr') || q.get('dying')) {
  scene.children.filter((o) => o.userData.anim).forEach((o) => scene.remove(o));
  const list = q.get('cpr') ? [['survivor', 'hunter', 'downed', 'get'], ['survivor', 'gunner', 'alive', 'give']]
    : [['zombie', 'zombie', 'dead'], ['survivor', 'hunter', 'dead'], ['survivor', 'gunner', 'dead']];
  list.forEach(([role, model, st, cpr], i) => {
    const av = makeAvatar(role, model);
    av.position.x = q.get('cpr') ? 0 : (i - 1) * 2.6;
    av.rotation.y = +(q.get('yaw') ?? 0.8);
    scene.add(av);
    const anim = av.userData.anim;
    anim.cpr = cpr ?? null;
    for (let t = 0; t < T; t += 1 / 60) anim.update(1 / 60, 0, st, 0);
    av.userData.st = st;
  });
  // ?after=초 — CPR 하다가 쓰러진 사람이 죽은 뒤 (살리던 사람은 cpr 해제, 쓰러진 사람은 dead)
  const after = +(q.get('after') ?? 0);
  if (after) for (const av of scene.children.filter((o) => o.userData.anim)) {
    av.userData.anim.cpr = null;
    const st = av.userData.st === 'downed' ? 'dead' : 'alive';
    for (let t = 0; t < after; t += 1 / 60) av.userData.anim.update(1 / 60, 0, st, 0);
    window.dbg = (window.dbg ?? '') + ' ' + av.userData.anim.currentName + ':' + av.visible;
  }
}
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0, 2, 10);
cam.lookAt(0, 0.9, 0);
renderer.setAnimationLoop(() => {
  if (renderer.domElement.width !== innerWidth) { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
  renderer.render(scene, cam);
});
</script>
</body>
</html>
