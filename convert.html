<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 빌더 — zombie-fps</title>
<style>
  :root {
    --bg: #15171c;  --panel: #1c1f27;  --line: #2c3240;
    --fg: #e6e9ef;  --muted: #8d96a8;  --accent: #3d7dff;
    --good: #4ec77f; --warn: #e8b23a; --bad: #ef5f5f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: 1fr 400px;
    font: 13px/1.6 ui-sans-serif, "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg); color: var(--fg); overflow: hidden;
  }

  #view { width: 100%; height: 100%; display: block; }

  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px;
  }
  h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: -.2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }

  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
       color: var(--muted); margin: 18px 0 7px; font-weight: 500; }

  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  label.btn, button {
    background: #262b36; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer;
    white-space: nowrap;
  }
  label.btn:hover, button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.15); }
  input[type=file] { display: none; }
  input[type=number] {
    background: #262b36; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12px; width: 72px;
  }
  label.inline { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }

  .clip-list { list-style: none; margin: 0; padding: 0; }
  .clip-list li {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px; margin-bottom: 4px;
    background: #22262f; font-size: 12px;
  }
  .clip-list li .name { flex: 1; }
  .clip-list li .dur { color: var(--muted); font-size: 11px; }
  .clip-list li button { padding: 2px 8px; font-size: 11px; }
  .clip-list li.active { background: rgba(61,125,255,.15); border: 1px solid var(--accent); }

  .log {
    font-size: 11px; color: var(--muted); max-height: 140px; overflow-y: auto;
    background: #181a20; border-radius: 6px; padding: 8px 10px; margin-top: 8px;
    font-family: ui-monospace, "Cascadia Code", monospace; line-height: 1.7;
  }
  .log .ok  { color: var(--good); }
  .log .err { color: var(--bad); }
  .log .warn{ color: var(--warn); }

  .badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 99px;
    background: rgba(78,199,127,.16); color: var(--good); margin-left: 6px;
  }
  .badge.pending { background: #22262f; color: #5c6474; }

  #status {
    position: fixed; left: 16px; bottom: 16px; z-index: 40; display: none;
    background: rgba(0,0,0,.78); padding: 7px 14px; border-radius: 6px; font-size: 12px;
  }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; grid-template-rows: 50% 50%; } }
</style>
</head>
<body>

<canvas id="view"></canvas>

<aside>
  <h1>캐릭터 빌더</h1>
  <div class="sub">Mixamo FBX + ComfyUI GLB → 게임용 GLB</div>

  <h2>1. 소스 파일</h2>
  <div class="row">
    <label class="btn">📦 ComfyUI GLB<input type="file" id="pickGlb" accept=".glb,.gltf"></label>
    <span id="glbBadge" class="badge pending">미적용</span>
  </div>
  <div class="row">
    <label class="btn">🦴 Mixamo FBX (여러 개)<input type="file" id="pickFbx" accept=".fbx" multiple></label>
  </div>

  <h2>2. 옵션</h2>
  <div class="row">
    <label class="inline">키(m) <input type="number" id="targetH" value="1.75" step="0.05" min="1.0" max="2.5"></label>
    <label class="inline"><input type="checkbox" id="stripRM" checked> 루트모션 제거</label>
  </div>

  <h2>3. 적용된 클립</h2>
  <ul class="clip-list" id="clipList">
    <li style="color:var(--muted)">FBX 파일을 열면 여기에 표시됩니다</li>
  </ul>

  <div class="row" style="margin-top:14px">
    <button class="primary" id="btnExport" disabled>⬇ GLB 내보내기</button>
  </div>

  <h2>로그</h2>
  <div class="log" id="log"></div>
</aside>

<div id="status"></div>
<script type="module" src="/src/convert.js"></script>
</body>
</html>
